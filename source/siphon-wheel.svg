<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Siphon wheel</title>
  <desc id="desc">A silver mechanical wheel inside a continuous cyan siphon. Water rises on the left, crests above the wheel, and falls on the right.</desc>
  <defs>
    <path id="circuit" d="M 174 422 C 131 422 96 387 96 344 C 96 299 96 214 96 214 C 96 134.5 168 70 256 70 C 344 70 416 134.5 416 214 C 416 259 416 344 416 344 C 416 387 381 422 338 422 C 283 422 229 422 174 422 Z" pathLength="100"/>
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="416" y1="422" x2="96" y2="70">
      <stop stop-color="#627DFA"/><stop offset=".42" stop-color="#36C9EF"/><stop offset=".72" stop-color="#94EDFF"/><stop offset="1" stop-color="#36C9EF"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="-8" y1="0" x2="18" y2="-120"><stop stop-color="#596778"/><stop offset="1" stop-color="#AFB9C6"/></linearGradient>
  </defs>
  <style>
    /* Edit the gradient stops above to match the site's accent. */
    .rotor { transform-origin:256px 266px; animation:turn 4s 2s linear infinite; }
    .water { stroke-dasharray:100 100; animation:prime 2s linear both; }
    .glints { opacity:0; animation:reveal 2s linear forwards; }
    .glint { stroke-dashoffset:var(--phase); animation:flow 4s 2s linear infinite; }
    @keyframes turn { from {transform:rotate(0deg)} to {transform:rotate(45deg)} }
    @keyframes flow { from {stroke-dashoffset:var(--phase)} to {stroke-dashoffset:calc(var(--phase) - 100)} }
    @keyframes prime { 0%,6.6667% {stroke-dashoffset:100} 95%,100% {stroke-dashoffset:0} }
    @keyframes reveal { 0%,90% {opacity:0} 100% {opacity:.42} }
    @media (prefers-reduced-motion:reduce) { .rotor,.water,.glints,.glint {animation:none} .water {stroke-dashoffset:0} .glints {opacity:.42} }
  </style>
  <rect width="512" height="512" fill="#090F18"/>
  <circle cx="256" cy="269" r="126" fill="none" stroke="#182332" stroke-width="15"/>
  <circle cx="256" cy="266" r="126" fill="none" stroke="#7D8999" stroke-width="12"/>
  <circle cx="256" cy="266" r="119" fill="none" stroke="#344152" stroke-width="2"/>
  <g class="rotor"><g transform="translate(256 266)"><g transform="rotate(0)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(45)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(90)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(135)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(180)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(225)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(270)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g><g transform="rotate(315)"><path d="M-7-36H7L18-112L4-120Z" fill="url(#metal)"/></g></g></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#circuit" stroke="#263343" stroke-width="28"/>
    <use href="#circuit" stroke="#121E2D" stroke-width="23"/>
    <use href="#circuit" class="water" stroke="url(#water)" stroke-width="16" pathLength="100"/>
    <g class="glints" stroke="#D2F8FF" stroke-width="5"><use href="#circuit" class="glint" pathLength="100" stroke-dasharray="6 94" style="--phase:0"/><use href="#circuit" class="glint" pathLength="100" stroke-dasharray="6 94" style="--phase:-25"/><use href="#circuit" class="glint" pathLength="100" stroke-dasharray="6 94" style="--phase:-50"/><use href="#circuit" class="glint" pathLength="100" stroke-dasharray="6 94" style="--phase:-75"/></g>
  </g>
  <circle cx="256" cy="266" r="29" fill="#344152"/>
  <circle cx="256" cy="266" r="23" fill="#AFB9C6"/>
  <circle cx="256" cy="266" r="17" fill="#121E2D"/>
  <circle cx="256" cy="266" r="6" fill="#36C9EF"/>
</svg>
